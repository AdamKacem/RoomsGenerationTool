<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="330" fill="#ffffff"/>
  <defs>
    <style>
      .area{fill:#eef1f6;stroke:#3a4150;stroke-width:3}
      .cut{stroke:#d9534f;stroke-width:3;stroke-dasharray:8 6}
      .wall{stroke:#3a4150;stroke-width:3}
      .door{stroke:#ffffff;stroke-width:6}
      .doordot{fill:#e0a800}
      .t{font-size:17px;fill:#1f2430;font-weight:600}
      .s{font-size:13px;fill:#4a5263}
      .room{fill:#dfe7f3}
    </style>
  </defs>

  <!-- Panel 1 -->
  <text x="40" y="34" class="t">1. Start with the whole map</text>
  <rect x="40" y="55" width="240" height="200" class="area"/>
  <text x="160" y="160" text-anchor="middle" class="s">48 x 48 units</text>
  <text x="40" y="285" class="s">Sizes are counted in wall pieces</text>
  <text x="40" y="303" class="s">(1 piece = 4 units)</text>

  <!-- Panel 2 -->
  <text x="350" y="34" class="t">2. Cut it in two, add a door</text>
  <rect x="350" y="55" width="240" height="200" class="area"/>
  <line x1="450" y1="55" x2="450" y2="255" class="cut"/>
  <line x1="450" y1="135" x2="450" y2="160" class="door"/>
  <circle cx="450" cy="147.5" r="6" class="doordot"/>
  <text x="350" y="285" class="s">Cuts land on wall piece edges, at least</text>
  <text x="350" y="303" class="s">Min Room Side pieces from each side</text>

  <!-- Panel 3 -->
  <text x="670" y="34" class="t">3. Repeat until small enough</text>
  <rect x="670" y="55" width="240" height="200" class="area"/>
  <line x1="770" y1="55" x2="770" y2="255" class="wall"/>
  <line x1="670" y1="155" x2="770" y2="155" class="wall"/>
  <line x1="770" y1="115" x2="910" y2="115" class="wall"/>
  <line x1="840" y1="115" x2="840" y2="255" class="wall"/>
  <line x1="770" y1="135" x2="770" y2="160" class="door"/>
  <circle cx="770" cy="147.5" r="6" class="doordot"/>
  <line x1="705" y1="155" x2="730" y2="155" class="door"/>
  <circle cx="717.5" cy="155" r="6" class="doordot"/>
  <line x1="820" y1="115" x2="845" y2="115" class="door"/>
  <circle cx="832.5" cy="115" r="6" class="doordot"/>
  <line x1="840" y1="190" x2="840" y2="215" class="door"/>
  <circle cx="840" cy="202.5" r="6" class="doordot"/>
  <text x="670" y="285" class="s">Each final space becomes a room with</text>
  <text x="670" y="303" class="s">walls, doors, floor, props, decorations</text>
</svg>
