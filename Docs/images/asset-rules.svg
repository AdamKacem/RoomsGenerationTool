<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1040" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9534f"/></marker>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5263"/></marker>
    <style>
      .t{font-size:17px;fill:#1f2430;font-weight:600}
      .s{font-size:13px;fill:#4a5263}
      .box{fill:#d5d9e0;stroke:#3a4150;stroke-width:2}
      .floor{fill:#9aa2ae;stroke:#3a4150;stroke-width:2}
      .pivot{fill:#e0a800;stroke:#1f2430;stroke-width:1.5}
      .dimline{stroke:#4a5263;stroke-width:1.5}
    </style>
  </defs>

  <!-- Wall, front view -->
  <text x="30" y="34" class="t">Wall piece (front view)</text>
  <rect x="50" y="70" width="240" height="190" class="box"/>
  <circle cx="170" cy="260" r="8" class="pivot"/>
  <text x="170" y="284" text-anchor="middle" class="s">pivot: floor level, middle of the length</text>
  <line x1="50" y1="305" x2="290" y2="305" class="dimline" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="170" y="325" text-anchor="middle" class="s">exactly 4 units long (along X)</text>
  <line x1="320" y1="260" x2="320" y2="70" class="dimline" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="330" y="170" class="s">any</text>
  <text x="330" y="186" class="s">height</text>

  <!-- Wall, top view -->
  <text x="420" y="34" class="t">Wall piece (top view)</text>
  <rect x="430" y="130" width="240" height="50" class="box"/>
  <circle cx="550" cy="155" r="8" class="pivot"/>
  <line x1="550" y1="125" x2="550" y2="72" stroke="#2f6fdb" stroke-width="3" marker-end="url(#arrowB)"/>
  <text x="562" y="86" class="s" fill="#2f6fdb">+Z (blue arrow) = faces the room</text>
  <line x1="550" y1="200" x2="660" y2="200" stroke="#d9534f" stroke-width="3" marker-end="url(#arrowR)"/>
  <text x="580" y="222" class="s">+X = along the wall</text>
  <text x="430" y="262" class="s">At rotation 0. The generator sets the</text>
  <text x="430" y="280" class="s">rotation itself, so a rotation on the</text>
  <text x="430" y="298" class="s">prefab's root object is ignored. Fillers and</text>
  <text x="430" y="316" class="s">the door wall follow the same rules.</text>

  <!-- Floor tile -->
  <text x="810" y="34" class="t">Floor tile (top view)</text>
  <rect x="820" y="80" width="160" height="160" class="floor"/>
  <circle cx="900" cy="160" r="8" class="pivot"/>
  <text x="820" y="268" class="s">pivot: center of the tile</text>
  <text x="820" y="286" class="s">any size: set Tile Size</text>
  <text x="820" y="304" class="s">on the Floor Placer</text>
</svg>
